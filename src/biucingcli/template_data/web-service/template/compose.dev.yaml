services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    command: air -c .air.toml
    environment:
{{COMPONENT_ENVIRONMENT}}
      OIDC_CLIENT_SECRET: local-web-secret
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:5556/dex}
      OIDC_AUTHORIZE_URL: ${OIDC_AUTHORIZE_URL:-http://localhost:5556/dex/auth}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      OIDC_CALLBACK: ${OIDC_CALLBACK:-http://localhost:8080/auth/callback}
      HOME: /tmp
      GOFLAGS: -buildvcs=false
      LOCAL_UID: "${LOCAL_UID:-1000}"
      LOCAL_GID: "${LOCAL_GID:-1000}"
      CONFIG_FILE: /workspace/configs/config.yaml
      GOCACHE: /workspace/.cache/go-build
      GOMODCACHE: /workspace/.cache/go-mod
      GOLANGCI_LINT_CACHE: /workspace/.cache/golangci-lint
    ports:
      - "127.0.0.1:${HOST_PORT:-0}:{{HTTP_PORT}}"
    depends_on: {{COMPONENT_DEPENDENCIES}}
    stop_grace_period: 30s
    volumes:
      - .:/workspace
      - web-service-go-build:/workspace/.cache/go-build
      - web-service-go-mod:/workspace/.cache/go-mod
      - web-service-golangci-lint:/workspace/.cache/golangci-lint

{{COMPONENT_SERVICES}}
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports: ["127.0.0.1:${IDP_PORT:-5556}:5556"]
    volumes: ["./.secrets/dex.yaml:/etc/dex/config.yaml:ro"]

volumes:
  postgres-data:
  web-service-go-build:
  web-service-go-mod:
  web-service-golangci-lint:
