environment: development
admin_addr: "127.0.0.1:9000"
log_level: INFO
request:
  max_bytes: 1048576
  concurrent: 64
  timeout_seconds: 5

service:
  name: {{SERVICE_NAME}}
  port: {{HTTP_PORT}}

server:
  read_timeout_seconds: 5
  read_header_timeout_seconds: 5
  write_timeout_seconds: 15
  idle_timeout_seconds: 60
  shutdown_timeout_seconds: 10

database:
  driver: {{DATABASE}}
  dsn: "{{DATABASE_DSN}}"

cache:
  driver: {{CACHE}}
  dsn: "{{CACHE_DSN}}"

data:
  max_connections: 10
  query_timeout_seconds: 3

auth:
  issuer: http://localhost:5556/dex
  jwks: http://dex:5556/dex/keys
  authorize_url: http://localhost:5556/dex/auth
  token_url: http://dex:5556/dex/token
  client_id: web-client
  audience: web-api
  origin: http://localhost:8080
  callback: http://localhost:8080/auth/callback
  secure: false

# Empty means no downstream startup dependency. See README for a named client.
dependencies: {}

telemetry:
  otlp_http_endpoint: ""
  sample_ratio: 0.1
