environment: development
admin_addr: "127.0.0.1:9000"
log_level: INFO
request:
  max_bytes: 1048576
  concurrent: 64
  timeout_seconds: 5

service:
  name: {{SERVICE_NAME}}
  port: {{HTTP_PORT}}

server:
  read_timeout_seconds: 5
  read_header_timeout_seconds: 5
  write_timeout_seconds: 15
  idle_timeout_seconds: 60
  shutdown_timeout_seconds: 10

database:
  driver: {{DATABASE}}
  dsn: "{{DATABASE_DSN}}"

cache:
  driver: {{CACHE}}
  dsn: "{{CACHE_DSN}}"
