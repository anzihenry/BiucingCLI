apiVersion: v1
kind: Service
metadata:
  name: '{{SERVICE_NAME}}'
  labels:
    app.kubernetes.io/name: '{{SERVICE_NAME}}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: '{{SERVICE_NAME}}'
    app.kubernetes.io/component: api
  ports:
  - name: grpc
    port: {{GRPC_PORT}}
    targetPort: grpc
  clusterIP: None
  publishNotReadyAddresses: false
