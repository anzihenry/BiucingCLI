services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    command: bash -c "./scripts/check proto && exec air -c .air.toml"
    environment:
      HOME: /tmp
      GOFLAGS: -buildvcs=false
      LOCAL_UID: "${LOCAL_UID:-1000}"
      LOCAL_GID: "${LOCAL_GID:-1000}"
      CONFIG_FILE: /workspace/configs/config.yaml
      GOCACHE: /workspace/.cache/go-build
      GOMODCACHE: /workspace/.cache/go-mod
      GOLANGCI_LINT_CACHE: /workspace/.cache/golangci-lint
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
{{COMPONENT_ENVIRONMENT}}
    ports:
      - "127.0.0.1:${HOST_HTTP_PORT:-0}:{{HTTP_PORT}}"
      - "127.0.0.1:${HOST_GRPC_PORT:-0}:{{GRPC_PORT}}"
    depends_on: {{COMPONENT_DEPENDENCIES}}
    stop_grace_period: 30s
    volumes:
      - .:/workspace
      - micro-service-go-build:/workspace/.cache/go-build
      - micro-service-go-mod:/workspace/.cache/go-mod
      - micro-service-golangci-lint:/workspace/.cache/golangci-lint

{{COMPONENT_SERVICES}}
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  postgres-data:
  micro-service-go-build:
  micro-service-go-mod:
  micro-service-golangci-lint:
