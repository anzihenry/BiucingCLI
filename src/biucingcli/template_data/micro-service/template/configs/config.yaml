environment: development
admin_addr: "127.0.0.1:9000"
log_level: INFO
request:
  max_bytes: 1048576
  concurrent: 64
  timeout_seconds: 5

service:
  name: {{SERVICE_NAME}}
  http_port: {{HTTP_PORT}}
  grpc_port: {{GRPC_PORT}}

server:
  read_timeout_seconds: 5
  read_header_timeout_seconds: 5
  write_timeout_seconds: 15
  idle_timeout_seconds: 60
  shutdown_timeout_seconds: 10

telemetry:
  otlp_http_endpoint: "{{OTEL_EXPORTER_ENDPOINT_JSON}}"

database:
  driver: {{DATABASE}}
  dsn: "{{DATABASE_DSN}}"

cache:
  driver: {{CACHE}}
  dsn: "{{CACHE_DSN}}"

data:
  max_connections: 10
  query_timeout_seconds: 3

workload:
  certificate: .secrets/server.crt
  key: .secrets/server.key
  roots: .secrets/ca.crt
  methods:
    /{{PROTO_PACKAGE}}.{{SERVICE_TYPE_NAME}}Service/Ping: ["spiffe://local/client"]
    /grpc.health.v1.Health/Check: ["spiffe://local/client"]
    /grpc.health.v1.Health/Watch: ["spiffe://local/client"]
  delegates: {}
