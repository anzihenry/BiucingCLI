name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.16"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv build --no-sources --no-build-isolation --out-dir frontend-dist
      - run: uv run --locked python scripts/verify-distribution --dist-dir frontend-dist
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-distributions
          path: frontend-dist/*
          if-no-files-found: error

  frontend:
    needs: frontend-artifact
    uses: ./.github/workflows/frontend.yml
    with:
      artifact-name: frontend-distributions

  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.16"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Run static checks
        run: uv run --locked ruff check --select E4,E7,E9,F src tests scripts
      - name: Run Python-only core tests
        run: uv run --locked python scripts/run-tests --suite core
      - name: Validate bundled templates
        run: uv run --locked biucing validate
      - name: Verify installed distribution
        run: uv run --locked python scripts/verify-distribution

  platform:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.16"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - name: Run macOS tool integrations
        run: uv run --locked python scripts/run-tests --suite platform
      - name: Verify generated Make entrypoints
        run: uv run --locked python scripts/verify-distribution --check-make
