[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biucingcli"
version = "0.9.1"
description = "A scaffold generator for independent developers built around a stable personal stack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
biucing = "biucingcli.cli:main"

[dependency-groups]
dev = ["ruff==0.16.6", "twine>=6.1,<7"]
# Keep setuptools aligned with build-system.requires for isolated installs too.
build = ["setuptools==84.0.0", "wheel>=0.45"]

[tool.uv]
required-version = ">=0.12.16,<0.13"
default-groups = ["dev", "build"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
