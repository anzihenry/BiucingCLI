[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biucingcli"
version = "0.9.0"
description = "A scaffold generator for independent developers built around a stable personal stack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
biucing = "biucingcli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
