services:
  {{SERVICE_NAME}}:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-golang:1.26-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.20}
    image: ${IMAGE:-{{SERVICE_NAME}}}:${TAG:-latest}
    ports:
      - "${HOST_HTTP_PORT:-{{HTTP_PORT}}}:{{HTTP_PORT}}"
      - "${HOST_GRPC_PORT:-{{GRPC_PORT}}}:{{GRPC_PORT}}"
    environment:
      CONFIG_FILE: /app/configs/config.yaml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      STORE_DSN: {{DEPENDENCY_STORE_CONTAINER_DSN}}
    depends_on:
      - {{DEPENDENCY_STORE}}
      - otel-collector

  {{DEPENDENCY_STORE}}:
    image: {{DEPENDENCY_STORE_IMAGE}}
{{DEPENDENCY_STORE_ENV_BLOCK}}
    ports:
      - "${HOST_DEPENDENCY_STORE_PORT:-{{DEPENDENCY_STORE_PORT}}}:{{DEPENDENCY_STORE_PORT}}"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${HOST_OTEL_GRPC_PORT:-4317}:4317"
      - "${HOST_OTEL_HTTP_PORT:-4318}:4318"
